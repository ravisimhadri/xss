    <text class="text" x="10" y="165">Client Streaming:</text>
    <text class="text" x="10" y="180" font-size="8">rpc UploadProfile(stream Profile) returns (Status)</text>

    <text class="text" x="10" y="200">Bidirectional Streaming:</text>
    <text class="text" x="10" y="215" font-size="8">rpc Chat(stream Message) returns (stream Message)</text>

