  <!-- =====================================================================
       REST API - FILE UPLOAD
       ===================================================================== -->
  <g transform="translate(10, 10)">
    <rect class="api" width="380" height="180" rx="5"/>
    <text class="title" x="10" y="25">📤 REST API - FILE UPLOAD</text>

    <text class="text" x="10" y="45">Multipart Form Upload:</text>
    <text class="text" x="10" y="60" font-size="8">POST /api/upload</text>
    <text class="text" x="10" y="75" font-size="8">Content-Type: multipart/form-data</text>
    <text class="text" x="10" y="90" font-size="8">file=@xss.svg;type=image/svg+xml</text>

    <text class="text" x="10" y="110">Base64 JSON Upload:</text>
    <text class="text" x="10" y="125" font-size="8">POST /api/upload</text>
    <text class="text" x="10" y="140" font-size="8">{'file': 'data:image/svg+xml;base64,PHN2Zy...'}</text>

    <text class="text" x="10" y="160">URL Parameter:</text>
    <text class="text" x="10" y="175" font-size="8">POST /api/avatar?url=data:image/svg+xml,<svg onload=alert(1)></text>

    <!-- Test vector -->
    <foreignObject x="200" y="40" width="170" height="130">
      <body xmlns="http://www.w3.org/1999/xhtml">
        <script>
          console.log('REST Upload XSS Vectors:');
          console.log('1. multipart/form-data with .svg');
          console.log('2. Base64 in JSON body');
          console.log('3. URL parameter with data: URI');
          console.log('4. Remote URL fetch (SSRF)');
          console.log('5. Chunked upload bypass');
        </script>
      </body>
    </foreignObject>
  </g>

